<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKK Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261005a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EKK Hub">
</head>
<body>

  <div id="loadingScreen" style="position:fixed;inset:0;z-index:9999;background:#F7F7F9;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity 500ms ease, transform 500ms ease;">
    <style>
      @keyframes ls-draw { to { stroke-dashoffset: 0; } }
      @keyframes ls-orb-drift { 0%{transform:translate(0,0)} 50%{transform:translate(30px,-20px)} 100%{transform:translate(0,0)} }
      @keyframes ls-fade-up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
      @keyframes ls-grid-drift { from{background-position:0 0;} to{background-position:-48px -48px;} }
      @keyframes ls-tick { 0%,100%{opacity:0.25} 50%{opacity:1} }
      .ls-grid { position:absolute; inset:-48px; background-image:radial-gradient(rgba(20,22,27,0.10) 1px, transparent 1px); background-size:24px 24px; animation:ls-grid-drift 6s linear infinite; }
      .ls-orb { position:absolute; border-radius:50%; filter:blur(60px); opacity:0.35; }
      .ls-orb-a { width:340px; height:340px; background:#14161B; top:-100px; left:-80px; animation:ls-orb-drift 9s ease-in-out infinite; }
      .ls-orb-b { width:280px; height:280px; background:#868D99; bottom:-100px; right:-60px; animation:ls-orb-drift 11s ease-in-out infinite reverse; }
      .ls-infinity-path { fill:none; stroke:#14161B; stroke-width:5; stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400; animation:ls-draw 1.8s cubic-bezier(0.65,0,0.35,1) forwards, ls-draw 1.8s cubic-bezier(0.65,0,0.35,1) 2.4s forwards; }
      .ls-ticks { display:flex; gap:5px; justify-content:center; margin-top:14px; }
      .ls-ticks span { width:4px; height:4px; border-radius:50%; background:#14161B; animation:ls-tick 1.2s ease-in-out infinite; }
      .ls-ticks span:nth-child(2) { animation-delay:0.15s; }
      .ls-ticks span:nth-child(3) { animation-delay:0.3s; }
    </style>
    <div class="ls-grid"></div>
    <div class="ls-orb ls-orb-a"></div>
    <div class="ls-orb ls-orb-b"></div>
    <div style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;">
      <svg viewBox="0 0 120 60" style="width:120px; height:60px; margin-bottom:20px; overflow:visible;">
        <path class="ls-infinity-path" d="M30,30 C30,18 40,10 50,20 C58,28 62,32 70,40 C80,50 90,42 90,30 C90,18 80,10 70,20 C62,28 58,32 50,40 C40,50 30,42 30,30 Z"/>
        <circle r="3.5" fill="#14161B">
          <animateMotion dur="3.2s" repeatCount="indefinite" path="M30,30 C30,18 40,10 50,20 C58,28 62,32 70,40 C80,50 90,42 90,30 C90,18 80,10 70,20 C62,28 58,32 50,40 C40,50 30,42 30,30 Z"/>
        </circle>
        <circle r="2.2" fill="#868D99">
          <animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite" path="M30,30 C30,18 40,10 50,20 C58,28 62,32 70,40 C80,50 90,42 90,30 C90,18 80,10 70,20 C62,28 58,32 50,40 C40,50 30,42 30,30 Z"/>
        </circle>
      </svg>
      <div style="animation:ls-fade-up 600ms ease both; animation-delay:200ms;">
        <div style="font-family:'Anton',sans-serif; font-size:26px; color:#14161B; letter-spacing:0.04em; text-align:center;">EKK HUB</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:10.5px; color:rgba(20,22,27,0.4); letter-spacing:0.2em; text-align:center; margin-top:4px;">MARKETING OPERATIONS</div>
      </div>
      <div class="ls-ticks"><span></span><span></span><span></span></div>
      <div style="margin-top:24px; width:160px; animation:ls-fade-up 600ms ease both; animation-delay:400ms;">
        <div style="height:2px; background:rgba(20,22,27,0.08); border-radius:2px; overflow:hidden;">
          <div id="loadingBar" style="height:100%; width:0%; background:#14161B; border-radius:2px; transition:width 300ms ease;"></div>
        </div>
        <div id="loadingLabel" style="font-family:'JetBrains Mono',monospace; font-size:10px; color:rgba(20,22,27,0.35); margin-top:8px; text-align:center; letter-spacing:0.1em;">INITIALIZING</div>
      </div>
    </div>
  </div>

  <div class="titlebar-drag-region"></div>
  <div class="mobile-topbar">
    <button class="hamburger-btn" id="hamburgerBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="mobile-topbar-title">EKK HUB</div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <aside class="sidebar">
    <div class="pulse-monitor" id="pulseMonitor">
      <svg id="pulseSvg" viewBox="0 0 300 60" preserveAspectRatio="none">
        <path id="pulsePath" d="" />
      </svg>
    </div>

    <div class="rail-label">Menu</div>
    <nav class="main-nav" id="mainNav">
      <div class="nav-pill" id="navPill"></div>
      <button class="nav-item active" data-nav="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        Overview
      </button>
      <button class="nav-item" data-nav="todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        Daily To-Do
      </button>
      <button class="nav-item" data-nav="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        All Projects
      </button>
    </nav>

    <div class="rail-label">Brands</div>
    <div class="brand-rail" id="brandRail">
      <div class="nav-pill" id="brandPill"></div>
      <button class="brand-tab active" data-brand="kdr" style="--dot-color:#14161B">
        <div class="dot"></div><span class="name">KDR</span>
      </button>
      <button class="brand-tab" data-brand="kvl" style="--dot-color:#565C68">
        <div class="dot"></div><span class="name">KVL</span>
      </button>
      <button class="brand-tab" data-brand="kpv" style="--dot-color:#868D99">
        <div class="dot"></div><span class="name">KPV</span>
      </button>
      <button class="brand-tab" data-brand="gst" style="--dot-color:#2B2E35">
        <div class="dot"></div><span class="name">GS</span>
      </button>
      <button class="brand-tab" data-brand="gtg" style="--dot-color:#9DA3AD">
        <div class="dot"></div><span class="name">GT</span>
      </button>
    </div>

    <div class="year-countdown">
      <div class="inf-wrap" id="infWrap">
        <img src="infinity-logo.png" class="inf-base" alt="">
        <img src="infinity-logo.png" class="inf-overlay" id="infOverlay" alt="">
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <div class="brand-eyebrow" id="brandEyebrow">KDR · DAILY RENTAL</div>
        <div class="main-title" id="mainTitle">Overview</div>
      </div>
    </div>

    <div id="viewMount"></div>
  </main>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

<script type="module" src="app.js?v=20261005a"></script>
<script>
  if ('serviceWorker' in navigator) {
    // If a newer service worker takes over while the app is open, reload once so the new files are used.
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then((reg) => reg.update()).catch(() => {});
    });
  }
</script>
</body>
</html>
