<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKK Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FF7A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EKK Hub">
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <aside class="sidebar">
    <div class="wordmark">YASSER'S EKK<span>HUB</span></div>

    <div class="rail-label">Menu</div>
    <nav class="main-nav" id="mainNav">
      <div class="nav-pill" id="navPill"></div>
      <button class="nav-item active" data-nav="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        Overview
      </button>
      <button class="nav-item" data-nav="todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        Daily To-Do
      </button>
      <button class="nav-item" data-nav="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        All Projects
      </button>
    </nav>

    <div class="rail-label">Brands</div>
    <div class="brand-rail" id="brandRail">
      <div class="nav-pill" id="brandPill"></div>
      <button class="brand-tab active" data-brand="kdr" style="--dot-color:#14161B">
        <div class="dot"></div><span class="name">KDR</span>
      </button>
      <button class="brand-tab" data-brand="kvl" style="--dot-color:#565C68">
        <div class="dot"></div><span class="name">KVL</span>
      </button>
      <button class="brand-tab" data-brand="kpv" style="--dot-color:#868D99">
        <div class="dot"></div><span class="name">KPV</span>
      </button>
    </div>

    <div class="year-countdown">
      <div class="inf-wrap" id="infWrap">
        <img src="infinity-logo.png" class="inf-base" alt="">
        <img src="infinity-logo.png" class="inf-overlay" id="infOverlay" alt="">
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <div class="brand-eyebrow" id="brandEyebrow">KDR · DAILY RENTAL</div>
        <div class="main-title" id="mainTitle">Overview</div>
      </div>
    </div>

    <div id="viewMount"></div>
  </main>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
  }
</script>
</body>
</html>
